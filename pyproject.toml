[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-review-agent"
version = "0.1.0"
description = "Policy Review Assistant: ZenML knowledge pipeline + LangGraph human-in-the-loop review workflow"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "chromadb>=0.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# `local` brings the SQLAlchemy-backed local metadata store the orchestrator
# needs to record runs; plain `zenml` cannot run a pipeline locally.
ingestion = ["zenml[local]>=0.70"]
live = ["anthropic>=0.40"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[project.scripts]
policy-ingest = "cli.ingest:main"
policy-review = "cli.review:main"
policy-web = "webapp.server:main"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".policy_index", ".policy_state", ".zen"]

[tool.ruff.lint]
# Correctness rules only. `I` (import ordering) and `UP` (pyupgrade) were
# dropped: together they flagged 419 annotation and import-order rewrites
# across the tree, none of which is a defect.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E501",  # line length is the formatter's concern, not the linter's
    "B008",  # FastAPI's Depends() in a default argument is idiomatic
    "B905",  # zip() strict=: the vectors here are aligned by construction
]

[tool.setuptools.package-data]
webapp = ["static/*"]

[tool.setuptools]
packages = ["agent", "agent.nodes", "agent.retrieval", "agent.risk", "agent.human_review", "agent.llm",
            "ingestion", "ingestion.pipelines", "ingestion.steps", "ingestion.chunking", "ingestion.evaluation",
            "shared", "config", "cli", "webapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Runs by default, and should: it is the only test that exercises the real
    # orchestrator, so it is the only thing that catches pipeline-wiring bugs
    # the plain step functions cannot see. Deselect with -m "not zenml" when
    # iterating on something unrelated.
    "zenml: exercises the real ZenML orchestrator (slower than the rest)",
    "subprocess: spawns a separate OS process to prove checkpoint recovery",
]
filterwarnings = ["ignore::DeprecationWarning"]